[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "mcp-package-health"
version = "0.1.0"
description = "MCP server for real-time package health, vulnerability scanning, and dependency graphs"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "fse08877-netizen" }]
keywords = ["mcp", "package-health", "vulnerability", "dependencies", "open-source"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "httpx>=0.27.0",
]

[project.optional-dependencies]
mcp = ["mcp>=1.0.0"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "anyio",
    "httpx>=0.27.0",
]

[project.urls]
Homepage = "https://github.com/fse08877-netizen/mcp-package-health"
Repository = "https://github.com/fse08877-netizen/mcp-package-health"
Issues = "https://github.com/fse08877-netizen/mcp-package-health/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
